<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palworld Companion - Pal Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --dark-bg: #1a1a2e;
            --card-bg: #16213e;
            --text-light: #eaeaea;
        }

        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--card-bg) 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px 0;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 40px 20px;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--primary-color);
        }

        .header h1 {
            font-weight: 700;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }

        .controls-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            background-color: #2a2a3e;
            border: 2px solid var(--primary-color);
            color: var(--text-light);
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 16px;
        }

        .search-box input::placeholder {
            color: #999;
        }

        .search-box input:focus {
            background-color: #2a2a3e;
            border-color: var(--secondary-color);
            color: var(--text-light);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
            outline: none;
        }

        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .filter-group select {
            background-color: #2a2a3e;
            border: 2px solid #444;
            color: var(--text-light);
            padding: 8px 12px;
            border-radius: 6px;
            min-width: 150px;
            cursor: pointer;
        }

        .filter-group select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .filter-group select option {
            background-color: var(--card-bg);
            color: var(--text-light);
        }

        .stats-info {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 10px;
        }

        .pals-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .pal-card {
            background: linear-gradient(135deg, var(--card-bg), #1f2a4a);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .pal-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .pal-image {
            width: 100%;
            height: 180px;
            background-color: #2a2a3e;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pal-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .pal-card h4 {
            margin: 10px 0;
            font-weight: 600;
            color: var(--text-light);
        }

        .pal-info-small {
            font-size: 0.9rem;
            margin: 5px 0;
            color: #aaa;
        }

        .element-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .element-Dark { background-color: #2a2a3e; color: #bbb; }
        .element-Dragon { background-color: #7c3aed; color: white; }
        .element-Earth { background-color: #92400e; color: white; }
        .element-Electricity { background-color: #eab308; color: #1a1a2e; }
        .element-Fire { background-color: #dc2626; color: white; }
        .element-Ice { background-color: #06b6d4; color: white; }
        .element-Leaf { background-color: #16a34a; color: white; }
        .element-None { background-color: #444; color: #aaa; }
        .element-Normal { background-color: #78716c; color: white; }
        .element-Water { background-color: #3b82f6; color: white; }

        .rarity-star {
            color: #fbbf24;
            margin-right: 3px;
        }

        .detail-modal {
            background-color: var(--card-bg);
            border-color: var(--primary-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        .detail-modal .modal-header {
            border-bottom: 2px solid var(--primary-color);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
        }

        .detail-modal .modal-body {
            color: var(--text-light);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background-color: #2a2a3e;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid var(--primary-color);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .ability-section {
            margin-top: 20px;
            padding: 15px;
            background-color: #2a2a3e;
            border-radius: 6px;
        }

        .ability-section h5 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--primary-color);
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1rem;
        }

        .clear-filters-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .clear-filters-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .results-info {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .pals-container {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }

            .filter-group {
                flex-direction: column;
            }

            .filter-group select {
                width: 100%;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1><i class="fas fa-database"></i> Palworld Pal Database</h1>
            <p>Search and explore detailed information about all Pals using their in-game English names</p>
        </div>
    </div>

    <div class="container">
        <div class="controls-section">
            <div class="search-box">
                <i class="fas fa-search" style="position: absolute; left: 15px; top: 12px; color: var(--primary-color);"></i>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by in-game name (e.g., Melpaca, Azurobe)..."
                    style="padding-left: 40px; width: 100%;"
                >
            </div>

            <div class="filter-group">
                <select id="elementFilter">
                    <option value="">All Elements</option>
                </select>
                <select id="sizeFilter">
                    <option value="">All Sizes</option>
                </select>
                <select id="rarityFilter">
                    <option value="">All Rarities</option>
                    <option value="1">1 Star</option>
                    <option value="2">2 Stars</option>
                    <option value="3">3 Stars</option>
                    <option value="4">4 Stars</option>
                    <option value="5">5 Stars</option>
                </select>
                <select id="workSuitabilityFilter">
                    <option value="">Sort by Work Suitability</option>
                    <option value="watering">Watering</option>
                    <option value="seeding">Seeding</option>
                    <option value="generateElectricity">Generate Electricity</option>
                    <option value="handcraft">Handcraft</option>
                    <option value="collection">Collection</option>
                    <option value="deforest">Deforest</option>
                    <option value="mining">Mining</option>
                    <option value="transport">Transport</option>
                    <option value="produceMedicine">Produce Medicine</option>
                    <option value="cool">Cool</option>
                    <option value="emitFlame">Emit Flame</option>
                    <option value="monsterFarm">Monster Farm</option>
                </select>
                <button class="clear-filters-btn" onclick="clearFilters()">Clear Filters</button>
            </div>

            <div class="stats-info">
                <span id="resultsCount">Loading Pals...</span>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Loading Pal data...
        </div>

        <div id="palsContainer" class="pals-container"></div>
        <div id="noResults" class="no-results" style="display: none;">
            <i class="fas fa-search"></i> No Pals found matching your criteria
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content detail-modal">
                <div class="modal-header">
                    <h5 class="modal-title" id="palName"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="palDetails"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allPals = [];
        let filteredPals = [];
        const detailModal = new bootstrap.Modal(document.getElementById('detailModal'));

        // Color mapping for elements
        const elementColors = {
            'Dark': '#2a2a3e',
            'Dragon': '#7c3aed',
            'Earth': '#92400e',
            'Electricity': '#eab308',
            'Fire': '#dc2626',
            'Ice': '#06b6d4',
            'Leaf': '#16a34a',
            'None': '#444',
            'Normal': '#78716c',
            'Water': '#3b82f6'
        };

        function getLocalizedPalName(palKey, nameMap, fallbackName) {
            const localizedName = nameMap && nameMap[`PAL_NAME_${palKey}`];
            if (localizedName && localizedName.trim() && localizedName.trim().toLowerCase() !== 'en_text') {
                return localizedName.trim();
            }
            return fallbackName || palKey;
        }

        function normalizeWikiFileName(value) {
            if (!value) return '';
            return value
                .normalize('NFKD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/["'“”‘’·•!?;:,\.\/\\()\[\]{}]/g, '')
                .replace(/[^\w\s-]/g, '')
                .trim()
                .replace(/\s+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_+|_+$/g, '');
        }

        function getWikiImageSlug(pal) {
            return normalizeWikiFileName(pal.name || pal.key || 'Unknown');
        }

        function getWikiIconUrl(pal) {
            const slug = getWikiImageSlug(pal);
            return `https://palworld.wiki.gg/images/${slug}_icon.png`;
        }

        function getWikiMenuUrl(pal) {
            const slug = getWikiImageSlug(pal);
            return `https://palworld.wiki.gg/images/${slug}_full.png`;
        }

        // Initialize
        async function init() {
            try {
                document.getElementById('loading').style.display = 'block';
                
                // Load pals.json to get the index
                const [palsIndexResponse, nameLookupResponse] = await Promise.all([
                    fetch('json/Pals/pals.json'),
                    fetch('json/L10N/en/DT_PalNameText_Common.json')
                ]);
                const palsIndex = await palsIndexResponse.json();
                const nameLookup = await nameLookupResponse.json();
                const nameMap = nameLookup.fields || {};

                // Load all pal data with limited concurrency
                const palsArray = Object.entries(palsIndex);
                const concurrencyLimit = 5;
                
                for (let i = 0; i < palsArray.length; i += concurrencyLimit) {
                    const batch = palsArray.slice(i, i + concurrencyLimit);
                    const batchResults = await Promise.all(
                        batch.map(async ([key, value]) => {
                            try {
                                // Skip entries that don't have a main property
                                if (!value.main) {
                                    return null;
                                }

                                // Convert Windows backslashes to forward slashes for web paths
                                const mainPath = value.main.replace(/\\/g, '/');
                                const iconPath = value.icon ? value.icon.replace(/\\/g, '/') : '';
                                
                                const response = await fetch(`json/Pals/${mainPath}`);
                                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                                
                                const data = await response.json();
                                const fallbackName = data.name || data.tribeName || key;
                                const identifierCandidate = [data.name, data.tribeName, key].find(value => {
                                    return typeof value === 'string' && value && !/^\d+$/.test(value);
                                }) || key;
                                data.key = identifierCandidate;
                                data.icon = iconPath;
                                data.name = getLocalizedPalName(identifierCandidate, nameMap, fallbackName);
                                data.searchText = `${data.name} ${fallbackName} ${data.tribeName || ''} ${identifierCandidate}`.toLowerCase();
                                return data;
                            } catch (e) {
                                return null;
                            }
                        })
                    );
                    allPals = allPals.concat(batchResults.filter(p => p !== null));
                }

                // Sort by name
                allPals.sort((a, b) => a.name.localeCompare(b.name));
                console.log('allPals:', allPals);
                window.allPals = allPals; // Expose for debugging
                // Populate filters
                populateFilters();

                // Display all pals
                filteredPals = [...allPals];
                render();

                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Failed to load pals:', error);
                document.getElementById('loading').innerHTML = '<p style="color: red;">Failed to load Pal data</p>';
            }
        }

        function populateFilters() {
            const elements = new Set();
            const sizes = new Set();

            allPals.forEach(pal => {
                if (pal.elementType1 && pal.elementType1 !== 'None') elements.add(pal.elementType1);
                if (pal.elementType2 && pal.elementType2 !== 'None') elements.add(pal.elementType2);
                if (pal.size) sizes.add(pal.size);
            });

            const elementFilter = document.getElementById('elementFilter');
            Array.from(elements).sort().forEach(element => {
                const option = document.createElement('option');
                option.value = element;
                option.textContent = element;
                elementFilter.appendChild(option);
            });

            const sizeFilter = document.getElementById('sizeFilter');
            const sizeOrder = ['XS', 'S', 'M', 'L', 'XL'];
            sizeOrder.forEach(size => {
                if (sizes.has(size)) {
                    const option = document.createElement('option');
                    option.value = size;
                    option.textContent = `Size: ${size}`;
                    sizeFilter.appendChild(option);
                }
            });
        }

        function filterPals() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const elementFilter = document.getElementById('elementFilter').value;
            const sizeFilter = document.getElementById('sizeFilter').value;
            const rarityFilter = document.getElementById('rarityFilter').value;
            const workSuitabilityFilter = document.getElementById('workSuitabilityFilter').value;

            filteredPals = allPals.filter(pal => {
                const matchesSearch = (pal.searchText || '').includes(searchTerm) ||
                    (pal.tribeName && pal.tribeName.toLowerCase().includes(searchTerm));
                const matchesElement = !elementFilter || 
                    pal.elementType1 === elementFilter || 
                    pal.elementType2 === elementFilter;
                const matchesSize = !sizeFilter || pal.size === sizeFilter;
                const matchesRarity = !rarityFilter || pal.rarity === parseInt(rarityFilter);

                return matchesSearch && matchesElement && matchesSize && matchesRarity && (pal.zukanIndex > -1);
            });

            if (workSuitabilityFilter) {
                filteredPals.sort((a, b) => {
                    const aValue = Number(a[workSuitabilityFilter] || 0);
                    const bValue = Number(b[workSuitabilityFilter] || 0);
                    return bValue - aValue;
                });
            } else {
                filteredPals.sort((a, b) => a.name.localeCompare(b.name));
            }

            render();
        }

        function render() {
            const container = document.getElementById('palsContainer');
            const noResults = document.getElementById('noResults');
            const resultsCount = document.getElementById('resultsCount');

            resultsCount.textContent = `Showing ${filteredPals.length} of ${allPals.length} Pals`;

            if (filteredPals.length === 0) {
                container.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            container.style.display = 'grid';
            noResults.style.display = 'none';
            
            container.innerHTML = filteredPals.map(pal => {
                const foodAmount = Math.max(0, Math.min(10, pal.foodAmount || 0));
                const foodAmountIcons = '<img src="https://static.wikia.nocookie.net/palworld/images/1/16/Food_on_icon.png/revision/latest/scale-to-width-down/15?cb=20240414211940" alt="Food On" style="width: 15px; height: 15px;">'.repeat(foodAmount) + '<img src="https://static.wikia.nocookie.net/palworld/images/d/dc/Food_off_icon.png/revision/latest/scale-to-width-down/15?cb=20240417215022" alt="Food Off" style="width: 15px; height: 15px;">'.repeat(10 - foodAmount);
                return `
                <div class="pal-card" onclick="showDetails('${pal.key}')">
                    <div class="pal-image">
                        <img src="${getWikiIconUrl(pal)}" alt="${pal.name}" onerror="this.style.display='none'">
                    </div>
                    <h4>${pal.name}</h4>
                    <div class="pal-info-small">
                        <strong>#${pal.gameIndex}</strong>
                    </div>
                    <div>
                        <span class="element-badge element-${pal.elementType1}">${pal.elementType1}</span>
                        ${pal.elementType2 && pal.elementType2 !== 'None' ? `<span class="element-badge element-${pal.elementType2}">${pal.elementType2}</span>` : ''}
                    </div>
                    <div class="pal-info-small">
                        Size: <strong>${pal.size}</strong>
                    </div>
                    <div class="pal-info-small">
                        ${foodAmountIcons}
                    </div>
                    <div style="margin-top: auto; padding-top: 10px; font-size: 0.9rem; color: #aaa;">
                        <div style="display: flex; justify-content: space-between; flex-wrap: wrap;">
                            <span><i class="fas fa-heart"></i>: <strong>${pal.hp || 0}</strong> </span> | <span><i class="fas fa-bolt"></i>: <strong>${pal.shotAttack || 0}</strong> </span> | <span><i class="fas fa-shield-alt"></i>: <strong>${pal.defense || 0}</strong></span>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function showDetails(palKey) {
            const pal = allPals.find(p => p.key === palKey);
            if (!pal) return;

            const foodAmount = Math.max(0, Math.min(10, pal.foodAmount || 0));
            const foodAmountIcons = '<img src="https://static.wikia.nocookie.net/palworld/images/1/16/Food_on_icon.png/revision/latest/scale-to-width-down/15?cb=20240414211940" alt="Food On" style="width: 15px; height: 15px;">'.repeat(foodAmount) + '<img src="https://static.wikia.nocookie.net/palworld/images/d/dc/Food_off_icon.png/revision/latest/scale-to-width-down/15?cb=20240417215022" alt="Food Off" style="width: 15px; height: 15px;">'.repeat(10 - foodAmount);

            document.getElementById('palName').textContent = `${pal.name} (${pal.tribeName})`;

            let detailsHtml = `
                <div class="row">
                    <div class="col-md-4 text-center">
                        <img src="${getWikiMenuUrl(pal)}" alt="${pal.name}" style="max-width: 100%; max-height: 250px; margin-bottom: 15px;" onerror="this.onerror=null; this.src='${getWikiIconUrl(pal)}'">
                        <div style="background-color: #2a2a3e; padding: 12px; border-radius: 6px;">
                            <div style="margin-bottom: 10px;">
                                <strong>Game Index:</strong> #${pal.gameIndex}
                            </div>
                            <div style="margin-bottom: 10px;">
                                <strong>Zukan Index:</strong> #${pal.zukanIndex}
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div style="background-color: #2a2a3e; padding: 12px; border-radius: 6px; margin-bottom: 15px;">
                            <h6 style="color: var(--primary-color); margin-bottom: 10px;">Basic Info</h6>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div><strong>Size:</strong> ${pal.size}</div>
                                <div><strong>Food:</strong> ${foodAmountIcons}</div>
                                <div><strong>Element 1:</strong> <span class="element-badge element-${pal.elementType1}">${pal.elementType1}</span></div>
                                <div><strong>Element 2:</strong> <span class="element-badge element-${pal.elementType2}">${pal.elementType2}</span></div>
                                <div><strong>Price:</strong> ${pal.price} Gold</div>
                                <div><strong>Capture Rate:</strong> ${(pal.captureRate * 100).toFixed(0)}%</div>
                            </div>
                        </div>

                        <div style="background-color: #2a2a3e; padding: 12px; border-radius: 6px;">
                            <h6 style="color: var(--primary-color); margin-bottom: 10px;">Behavior</h6>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem;">
                                <div><strong>Nocturnal:</strong> ${pal.isNocturnal ? 'Yes' : 'No'}</div>
                                <div><strong>Edible:</strong> ${pal.isEdible ? 'Yes' : 'No'}</div>
                                <div><strong>Is Boss:</strong> ${pal.isBoss ? 'Yes' : 'No'}</div>
                                <div><strong>Is Tower Boss:</strong> ${pal.isTowerBoss ? 'Yes' : 'No'}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="ability-section">
                    <h6>Work Abilities</h6>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.9rem;">zxc${pal.produceMedicine}
                        ${pal.emitFlame > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/d/d7/Kindling_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414213341"> Kindling: ${pal.emitFlame}</div>` : ''}
                        ${pal.watering > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/4/48/Watering_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414212635" alt="Watering"> Watering: ${pal.watering}</div>` : ''}
                        ${pal.seeding > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/7/75/Planting_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414212740" alt="Planting"> Planting: ${pal.seeding}</div>` : ''}
                        ${pal.generateElectricity > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/0/0f/Generating_Electricity_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414213302" alt="Electricity"> Electricity: ${pal.generateElectricity}</div>` : ''}
                        ${pal.handcraft > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/a/a2/Handiwork_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414213153" alt="Handiwork"> ${pal.handcraft}</div>` : ''}
                        ${pal.collection > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/a/a2/Gathering_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414213450" alt="Gathering"> Gathering: ${pal.collection}</div>` : ''}
                        ${pal.deforest > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/b/bc/Lumbering_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414213420" alt="Lumbering"> Lumbering: ${pal.deforest}</div>` : ''}
                        ${pal.mining > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/7/7b/Mining_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414213127"> ${pal.mining}</div>` : ''}
                        ${pal.produceMedicine ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/e/e9/Medicine_Production_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414213031"> Medicine: ${pal.produceMedicine}</div>` : ''}
                        ${pal.cool > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/3/32/Cooling_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414213550"> Cooling: ${pal.cool}</div>` : ''}
                        ${pal.transport > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/8/8f/Transporting_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414212712"></i> ${pal.transport} (${pal.transportSpeed || 0})</div>` : ''}
                        ${pal.monsterFarm > 0 ? `<div><img src="https://static.wikia.nocookie.net/palworld/images/d/d7/Farming_Icon.png/revision/latest/scale-to-width-down/24?cb=20240414213105"> Farming: ${pal.monsterFarm}</div>` : ''}
                    </div>
                    ${!pal.watering && !pal.seeding && !pal.generateElectricity && !pal.handcraft && !pal.collection && !pal.deforest && !pal.mining && !pal.transport && !pal.produceMedicine && !pal.cool && !pal.emitFlame && !pal.monsterFarm ? '<p style="color: #666;">No work abilities</p>' : ''}
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">HP</div>
                        <div class="stat-value">${pal.hp || 0}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Full Stomach</div>
                        <div class="stat-value">${pal.maxFullStomach || 0}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Attack</div>
                        <div class="stat-value">${pal.shotAttack || 0}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Defense</div>
                        <div class="stat-value">${pal.defense || 0}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Support</div>
                        <div class="stat-value">${pal.support || 0}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Stamina</div>
                        <div class="stat-value">${pal.stamina || 0}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Walk Speed</div>
                        <div class="stat-value">${pal.walkSpeed || 0}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Run Speed</div>
                        <div class="stat-value">${pal.runSpeed || 0}</div>
                    </div>
                </div>


                <div class="ability-section" style="margin-top: 20px;">
                    <h6>Additional Stats</h6>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 0.9rem;">
                        <div><strong>Craft Speed:</strong> ${pal.craftSpeed}%</div>
                        <div><strong>Max Hunger:</strong> ${pal.maxFullStomach}</div>
                        <div><strong>Viewing Distance:</strong> ${pal.viewingDistance}m</div>
                        <div><strong>Viewing Angle:</strong> ${pal.viewingAngle}°</div>
                        <div><strong>Male Probability:</strong> ${pal.maleProbability}%</div>
                        <div><strong>Combi Rank:</strong> ${pal.combiRank}</div>
                    </div>
                </div>
            `;

            document.getElementById('palDetails').innerHTML = detailsHtml;
            detailModal.show();
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('elementFilter').value = '';
            document.getElementById('sizeFilter').value = '';
            document.getElementById('rarityFilter').value = '';
            document.getElementById('workSuitabilityFilter').value = '';
            filterPals();
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filterPals);
        document.getElementById('elementFilter').addEventListener('change', filterPals);
        document.getElementById('sizeFilter').addEventListener('change', filterPals);
        document.getElementById('rarityFilter').addEventListener('change', filterPals);
        document.getElementById('workSuitabilityFilter').addEventListener('change', filterPals);

        // Initialize on load
        init();
    </script>
</body>
</html>
